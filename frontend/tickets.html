<!DOCTYPE html>
<html lang="pl" data-title-key="page_title_tickets">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src https://telegram-bots-backend.onrender.com https://telegram-bots.pl http://localhost:3000; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Moje zgłoszenia | KALIANG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260824">
    <link rel="stylesheet" href="tickets.css?v=20260824">
    <link rel="stylesheet" href="i18n/i18n.css?v=20260824">
</head>
<body>
    <header id="site-header">
        <nav>
            <div class="logo"><a href="index.html">KALIANG</a></div>
            <button class="mobile-menu-toggle" id="menu-toggle" aria-label="Открыть меню" aria-expanded="false" data-i18n-aria="nav_open_menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#services" data-i18n="nav_services">Usługi</a></li>
                <li><a href="index.html#portfolio" data-i18n="nav_portfolio">Portfolio</a></li>
            </ul>
        </nav>
    </header>

    <div class="tickets-app">
        <!-- ── Sidebar ──────────────────────── -->
        <aside class="tickets-sidebar">
            <div class="sidebar-user">
                <div class="sidebar-username" id="sidebar-username">Ładowanie...</div>
                <div class="sidebar-role" data-i18n="sidebar_role">Klient</div>
            </div>

            <div class="sidebar-create">
                <button class="btn btn-primary" id="create-ticket-btn" data-i18n="sidebar_new_ticket">+ Nowe zgłoszenie</button>
            </div>

            <nav class="sidebar-filters">
                <div class="filter-label" data-i18n="filter_label">Filtr</div>
                <button class="filter-link active" data-filter="all">
                    <span data-i18n="filter_all">Wszystkie</span>
                    <span class="filter-count" id="count-all">0</span>
                </button>
                <button class="filter-link" data-filter="open">
                    <span data-i18n="filter_open">Otwarte</span>
                    <span class="filter-count" id="count-open">0</span>
                </button>
                <button class="filter-link" data-filter="in_progress">
                    <span data-i18n="filter_progress">W trakcie</span>
                    <span class="filter-count" id="count-progress">0</span>
                </button>
                <button class="filter-link" data-filter="closed">
                    <span data-i18n="filter_closed">Zamknięte</span>
                    <span class="filter-count" id="count-closed">0</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-logout" id="logout-btn" data-i18n="logout_btn">Wyloguj się</button>
            </div>
        </aside>

        <!-- ── Main ────────────────────────── -->
        <main class="tickets-main">
            <div class="tickets-main-header">
                <h1 class="tickets-main-title" data-i18n="tickets_main_title">Moje zgłoszenia</h1>
                <span class="tickets-count" id="tickets-count"></span>
            </div>

            <div class="tickets-body" id="tickets-body">
                <!-- skeleton / list rendered by JS -->
            </div>
        </main>
    </div>

    <!-- ── Slide-out ticket panel ─────────── -->
    <div class="ticket-panel-overlay" id="panel-overlay"></div>
    <div class="ticket-panel" id="ticket-panel">
        <div class="tp-header">
            <div class="tp-header-info">
                <div class="tp-subject" id="tp-subject">—</div>
                <div class="tp-meta-row" id="tp-meta-row"></div>
            </div>
            <button class="tp-close" id="tp-close">×</button>
        </div>
        <div class="tp-assigned" id="tp-assigned" style="display:none;"></div>
        <div class="tp-messages" id="tp-messages"></div>
        <div id="tp-form-area"></div>
    </div>

    <!-- ── Create ticket modal ────────────── -->
    <div class="modal create-modal" id="create-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><h3 data-i18n="create_modal_title">Nowe zgłoszenie</h3></div>
                <button class="modal-close" id="create-modal-close">×</button>
            </div>
            <div class="modal-body">
                <form id="create-ticket-form" class="create-form">
                    <div class="form-group">
                        <label for="ticket-subject" data-i18n="create_form_subject">Temat</label>
                        <input type="text" id="ticket-subject" required maxlength="200"
                               data-i18n-ph="create_form_subject_ph"
                               placeholder="Np.: Ile kosztuje bot do sklepu?">
                    </div>
                    <div class="form-group">
                        <label for="ticket-message" data-i18n="create_form_message">Wiadomość</label>
                        <textarea id="ticket-message" required rows="5"
                                  data-i18n-ph="create_form_message_ph"
                                  placeholder="Opisz swoje pytanie lub zadanie..."></textarea>
                    </div>

                    <!-- Promo code section -->
                    <div class="form-group ticket-promo-group">
                        <label data-i18n="cfg_promo_label">Kod promocyjny (opcjonalnie)</label>
                        <div class="ticket-promo-field">
                            <input
                                type="text"
                                id="ticket-promo-input"
                                class="ticket-promo-input"
                                data-i18n-ph="cfg_promo_placeholder"
                                placeholder="Wprowadź kod promocyjny"
                                maxlength="50"
                                autocomplete="off"
                                spellcheck="false"
                            >
                            <button type="button" class="btn btn-ghost ticket-promo-apply-btn" id="ticket-promo-apply-btn" data-i18n="cfg_promo_apply">
                                Zastosuj
                            </button>
                        </div>
                        <div class="ticket-promo-status" id="ticket-promo-status" style="display:none;"></div>

                        <!-- Benefit choice — shown after valid code -->
                        <div class="ticket-promo-benefits" id="ticket-promo-benefits" style="display:none;">
                            <p class="ticket-promo-benefits-title" data-i18n="cfg_promo_choose">Wybierz swój bonus:</p>
                            <div class="ticket-promo-benefit-list">
                                <label class="ticket-promo-benefit" id="ticket-benefit-free-mini" style="display:none;">
                                    <input type="radio" name="ticket-promo-benefit" value="free_mini">
                                    <span class="tpb-name" data-i18n="cfg_promo_free_mini_name">Darmowy bot Mini</span>
                                    <span class="tpb-hint" data-i18n="cfg_promo_free_mini_desc_short">Mini bot za $0 (własny serwer)</span>
                                </label>
                                <label class="ticket-promo-benefit" id="ticket-benefit-percent-10">
                                    <input type="radio" name="ticket-promo-benefit" value="percent_10">
                                    <span class="tpb-name" data-i18n="cfg_promo_pct_name">Zniżka 10%</span>
                                    <span class="tpb-hint" data-i18n="cfg_promo_pct_desc_short">10% taniej na dowolny pakiet</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" data-i18n="create_submit">
                        Utwórz zgłoszenie
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">KALIANG</div>
            <div class="footer-links">
                <a href="https://t.me/Kaliang_dev" target="_blank" rel="noopener">Telegram</a>
                <a href="auth.html" data-i18n="footer_support">Wsparcie</a>
            </div>
            <p class="footer-copyright" data-i18n="footer_copyright">© 2026 Kaliang. Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script src="i18n/ru.js?v=20260824"></script>
    <script src="i18n/pl.js?v=20260824"></script>
    <script src="i18n/en.js?v=20260824"></script>
    <script src="i18n/i18n.js?v=20260824"></script>
    <script src="script.js?v=20260824"></script>
    <script src="api.js?v=20260824"></script>
    <script src="tickets.js?v=20260824"></script>
</body>
</html>
