<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="ava" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7984f5"/><stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#313338"/>

  <!-- server rail -->
  <rect width="120" height="900" fill="#1e1f22"/>
  <rect x="28" y="36" width="64" height="64" rx="20" fill="#5865f2"/>
  <text x="60" y="78" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
  <circle cx="60" cy="150" r="26" fill="#393c41"/>
  <circle cx="60" cy="220" r="26" fill="#393c41"/>
  <circle cx="60" cy="290" r="26" fill="#393c41"/>

  <!-- channel sidebar -->
  <rect x="120" width="320" height="900" fill="#2b2d31"/>
  <rect x="120" width="320" height="96" fill="#232428"/>
  <text x="152" y="60" font-size="30" font-weight="700" fill="#f2f3f5">Kaliang Server</text>
  <text x="152" y="150" font-size="22" fill="#949ba4">TEXT CHANNELS</text>
  <rect x="136" y="176" width="288" height="56" rx="10" fill="#3f4147"/>
  <text x="160" y="213" font-size="28" font-weight="600" fill="#f2f3f5"># welcome</text>
  <text x="160" y="277" font-size="28" fill="#949ba4"># general</text>
  <text x="160" y="337" font-size="28" fill="#949ba4"># rules</text>
  <text x="160" y="397" font-size="28" fill="#949ba4"># roles</text>

  <!-- main header -->
  <rect x="440" width="1160" height="96" fill="#2b2d31"/>
  <text x="476" y="60" font-size="30" font-weight="700" fill="#f2f3f5"># welcome</text>
  <text x="660" y="60" font-size="24" fill="#949ba4">greet newcomers here</text>

  <!-- bot message -->
  <circle cx="500" cy="200" r="34" fill="url(#ava)"/>
  <rect x="482" y="190" width="36" height="26" rx="7" fill="#1e1f22" opacity="0.6"/>
  <circle cx="493" cy="203" r="4" fill="#c9cdfb"/><circle cx="507" cy="203" r="4" fill="#c9cdfb"/>
  <text x="556" y="192" font-size="30" font-weight="700" fill="#7984f5">Mini Bot</text>
  <rect x="700" y="166" width="76" height="34" rx="8" fill="#5865f2"/>
  <text x="738" y="190" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">BOT</text>
  <text x="796" y="192" font-size="22" fill="#949ba4">today at 12:00</text>
  <text x="556" y="246" font-size="30" fill="#dbdee1">Welcome @alex! Great to see you here.</text>

  <!-- role embed card -->
  <rect x="556" y="286" width="640" height="150" rx="12" fill="#2b2d31"/>
  <rect x="556" y="286" width="8" height="150" fill="#23a559"/>
  <text x="596" y="340" font-size="26" font-weight="600" fill="#f2f3f5">Role assigned</text>
  <rect x="596" y="364" width="150" height="44" rx="22" fill="#23a559" opacity="0.18"/>
  <circle cx="622" cy="386" r="7" fill="#23a559"/>
  <text x="640" y="395" font-size="24" fill="#4fd68b">member</text>

  <!-- second message skeleton -->
  <circle cx="500" cy="520" r="34" fill="#393c41"/>
  <rect x="556" y="496" width="220" height="20" rx="10" fill="#949ba4" opacity="0.5"/>
  <rect x="556" y="540" width="560" height="16" rx="8" fill="#dbdee1" opacity="0.25"/>
  <rect x="556" y="574" width="420" height="16" rx="8" fill="#dbdee1" opacity="0.25"/>

  <!-- input -->
  <rect x="476" y="780" width="1088" height="72" rx="14" fill="#383a3f"/>
  <text x="508" y="826" font-size="26" fill="#87898c">Message #welcome</text>
</svg>
